<!-- @dsCard group="Components" viewport="700x380" name="Selection & Input" subtitle="Switch, Checkbox, Radio, TextField, DatePicker" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--background-normal-normal,#fff)}.row{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.lbl{width:100%;font:600 12px/1 var(--font-sans);color:var(--label-alternative,#8a8d94);letter-spacing:.02em;text-transform:uppercase;margin:4px 0}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Switch, Checkbox, Radio, TextField, DatePicker } = window.TecAceDesignSystem_64e6de;
function Demo(){
  const [on,setOn]=React.useState(true);const [ck,setCk]=React.useState(true);const [rd,setRd]=React.useState('a');
  return (<div>
   <div class="lbl">Switch · Checkbox · Radio</div>
   <div className="row">
     <Switch active={on} onChange={setOn}/><Switch active={false} onChange={()=>{}}/><Switch active disable/>
     <Checkbox checked={ck} label="동의" onChange={setCk}/><Checkbox indeterminate label="일부"/><Checkbox disable label="비활성"/>
     <Radio checked={rd==='a'} label="옵션 A" onChange={()=>setRd('a')}/><Radio checked={rd==='b'} label="옵션 B" onChange={()=>setRd('b')}/>
   </div>
   <div class="lbl">TextField · DatePicker</div>
   <div className="row" style={{alignItems:'flex-start'}}>
     <TextField label="이메일" placeholder="you@tecace.com" style={{width:220}}/>
     <TextField label="오류" defaultValue="잘못된 값" error helper="확인이 필요합니다" style={{width:220}}/>
     <div style={{boxShadow:'inset 0 0 0 1px var(--line-solid-neutral,#e1e2e4)',borderRadius:16}}><DatePicker/></div>
   </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
