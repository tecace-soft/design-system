<!-- @dsCard group="Components" viewport="700x300" name="Filters, Toggle & Auto-Complete" subtitle="ChipFilter, ChipMultiSelect, ToggleIcon, AutoComplete" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--background-normal-normal,#fff)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.lbl{width:100%;font:600 12px/1 var(--font-sans);color:var(--label-alternative,#8a8d94);letter-spacing:.02em;text-transform:uppercase;margin:4px 0}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { ChipFilter, ChipMultiSelect, ToggleIcon, AutoComplete } = window.TecAceDesignSystem_64e6de;
const Bookmark = <svg viewBox="0 0 20 20" width="100%" height="100%" fill="currentColor"><path d="M5 3h10a1 1 0 0 1 1 1v13l-6-3.5L4 17V4a1 1 0 0 1 1-1z"/></svg>;
function Demo(){
  const [exp,setExp]=React.useState(false);const [sel,setSel]=React.useState(true);const [save,setSave]=React.useState(true);
  return (<div>
   <div class="lbl">ChipFilter — default / selected+count / disabled</div>
   <div className="row">
     <ChipFilter label="지역" expand={exp} onClick={()=>setExp(!exp)}/>
     <ChipFilter label="직무" count={3} state="selected"/>
     <ChipFilter label="비활성" state="disabled"/>
     <ChipFilter label="Large" size="lg"/>
   </div>
   <div class="lbl">ChipMultiSelect · ToggleIcon</div>
   <div className="row">
     <ChipMultiSelect label="React" state={sel?"selected":"default"} onClick={()=>setSel(!sel)}/>
     <ChipMultiSelect label="Vue" state="default"/>
     <ChipMultiSelect label="비활성" state="disabled"/>
     <ToggleIcon icon={Bookmark} active={save} onClick={()=>setSave(!save)}/>
     <ToggleIcon icon={Bookmark} active={false}/>
   </div>
   <div class="lbl">AutoComplete</div>
   <div className="row"><AutoComplete options={["서울특별시","부산광역시","대구광역시","인천광역시","광주광역시"]} width={280}/></div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
