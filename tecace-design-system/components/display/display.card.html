<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--background-normal-alternative,#f7f8f9)}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.lbl{width:100%;font:600 12px/1 var(--font-sans);color:var(--label-alternative,#8a8d94);letter-spacing:.02em;text-transform:uppercase;margin:4px 0}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Avatar, AvatarGroup, Badge, ContentBadge, Card, Divider } = window.TecAceDesignSystem_64e6de;
const Bell = <svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor"><path d="M12 22a2.5 2.5 0 002.45-2h-4.9A2.5 2.5 0 0012 22zm7-6l-1.5-2v-4a5.5 5.5 0 00-11 0v4L5 16v1h14v-1z"/></svg>;
function Demo(){return (<div>
  <div class="lbl">Avatar · Avatar Group · Badge</div>
  <div className="row">
    <Avatar name="김" size="sm"/><Avatar name="이" size="md"/><Avatar name="TA" variant="company" size="md"/><Avatar size="lg"/>
    <AvatarGroup avatars={[{name:'A'},{name:'B'},{name:'C'},{name:'D'},{name:'E'}]} max={3}/>
    <Badge count={5}><span style={{width:32,height:32,borderRadius:8,background:'var(--fill-normal)',display:'inline-flex',alignItems:'center',justifyContent:'center',color:'var(--label-normal)'}}>{Bell}</span></Badge>
    <Badge dot><span style={{width:32,height:32,borderRadius:8,background:'var(--fill-normal)',display:'inline-flex',alignItems:'center',justifyContent:'center',color:'var(--label-normal)'}}>{Bell}</span></Badge>
  </div>
  <div class="lbl">Content Badge</div>
  <div className="row"><ContentBadge label="Primary"/><ContentBadge label="Positive" color="positive"/><ContentBadge label="Negative" color="negative"/><ContentBadge label="Caution" color="cautionary"/><ContentBadge label="Solid" variant="solid"/></div>
  <div class="lbl">Card + Divider</div>
  <div className="row">
    <Card style={{width:200}}><div style={{font:'600 15px/1.4 var(--font-sans)',color:'var(--label-normal)'}}>Outlined card</div><Divider inset={0} style={{margin:'12px 0'}}/><div style={{font:'500 13px/1.4 var(--font-sans)',color:'var(--label-alternative)'}}>Subtle 1px inset border.</div></Card>
    <Card variant="elevated" style={{width:200}}><div style={{font:'600 15px/1.4 var(--font-sans)',color:'var(--label-normal)'}}>Elevated card</div><div style={{marginTop:8,font:'500 13px/1.4 var(--font-sans)',color:'var(--label-alternative)'}}>Soft ambient shadow.</div></Card>
  </div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
