<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">

<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const D = window.TecAceDesignSystem_64e6de;
const { TextButton, Select, SearchField, Stepper, SegmentedControl, Pagination, ProgressBar, Skeleton, ListRow, SectionHeader, Avatar, ContentBadge } = D;
function Demo(){
  const [sel,setSel]=React.useState('서울');const [seg,setSeg]=React.useState('추천');const [pg,setPg]=React.useState(1);const [n,setN]=React.useState(2);
  const chev=<svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;

    <div class="lbl">TextButton · Select · SearchField · Stepper</div>
    <div className="row" style={{alignItems:'flex-end'}}>
      <TextButton label="더보기" trailingIcon={chev}/><TextButton label="neutral" color="neutral"/>

      <div style={{width:220}}><SearchField placeholder="채용 검색" defaultValue=""/></div>

    <div class="lbl">SegmentedControl · Pagination</div>

    </div>
    <div class="lbl">SectionHeader · ListRow</div>
    <div style={{border:'1px solid var(--line-normal)',borderRadius:16,overflow:'hidden',maxWidth:420}}>
      <SectionHeader title="추천 포지션" actionLabel="전체보기"/>
      <ListRow leading={<Avatar name="토" variant="company"/>} title="Frontend Engineer" description="토스 · 서울 강남구" trailing={<span style={{display:'flex',alignItems:'center',gap:8}}><ContentBadge label="채용중" size="sm"/>{chev}</span>} divider/>
