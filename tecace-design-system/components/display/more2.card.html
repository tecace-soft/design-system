<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--background-normal-normal,#fff)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.lbl{font:600 12px/1 var(--font-sans);color:var(--label-alternative,#8a8d94);letter-spacing:.02em;text-transform:uppercase;margin:0 0 8px}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Banner, Slider, Accordion, Tag, Menu, Breadcrumb, EmptyState } = window.TecAceDesignSystem_64e6de;
const info=<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="2"/><path d="M12 11v5M12 8h.01" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>;
const box=<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none"><path d="M4 7h16v13H4zM9 7V5h6v2" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
function Demo(){
  const [s,setS]=React.useState(60);
  return (<div className="grid">
   <div><div class="lbl">Banner</div><div style={{display:'flex',flexDirection:'column',gap:8}}>
     <Banner color="info" icon={info} title="새 소식" message="주간 채용 리포트가 도착했어요."/>
     <Banner color="cautionary" message="프로필을 완성해 주세요."/></div></div>
   <div><div class="lbl">Slider</div><div style={{padding:'4px 0'}}><Slider value={s} onChange={setS}/></div>
     <div class="lbl" style={{marginTop:16}}>Tag</div><div style={{display:'flex',gap:6,flexWrap:'wrap'}}><Tag label="React" onRemove={()=>{}}/><Tag label="정규직" dotColor="var(--status-positive)"/><Tag label="원격"/></div>
     <div class="lbl" style={{marginTop:16}}>Breadcrumb</div><Breadcrumb items={['홈','채용','개발']}/></div>
   <div><div class="lbl">Accordion</div><Accordion items={[{title:'지원 자격은 어떻게 되나요?',content:'경력 3년 이상이면 지원할 수 있어요.'},{title:'전형 절차가 궁금해요',content:'서류 → 과제 → 인터뷰 순으로 진행됩니다.'}]}/></div>
   <div><div class="lbl">Menu · EmptyState</div>
     <div style={{display:'flex',gap:16,alignItems:'flex-start'}}>
       <Menu items={[{label:'수정'},{label:'공유'},{divider:true},{label:'삭제',danger:true}]}/>
       <EmptyState icon={box} title="저장한 공고 없음" description="관심 공고를 저장해 보세요." style={{padding:'8px'}}/>
     </div></div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
