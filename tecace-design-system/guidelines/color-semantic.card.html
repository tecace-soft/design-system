<!-- @dsCard group="Colors" viewport="700x150" name="Semantic — Status" subtitle="Positive / Negative / Cautionary / Informative" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--background-normal-normal,#fff);font-family:var(--font-sans)}*{box-sizing:border-box}</style></head><body><div style="display:flex;gap:10px">
<div style="flex:1;min-width:0"><div style="height:56px;border-radius:10px;background:var(--status-positive,rgb(10,190,92));box-shadow:inset 0 0 0 1px rgba(112,115,124,0.12)"></div><div style="margin-top:6px;font:600 11px/1.3 var(--font-sans);color:var(--label-normal)">Positive</div><div style="font:500 10px/1.3 var(--font-mono);color:var(--label-alternative,#8a8d94)">rgb(10,190,92)</div></div>
<div style="flex:1;min-width:0"><div style="height:56px;border-radius:10px;background:var(--status-negative,rgb(232,48,52));box-shadow:inset 0 0 0 1px rgba(112,115,124,0.12)"></div><div style="margin-top:6px;font:600 11px/1.3 var(--font-sans);color:var(--label-normal)">Negative</div><div style="font:500 10px/1.3 var(--font-mono);color:var(--label-alternative,#8a8d94)">rgb(232,48,52)</div></div>
<div style="flex:1;min-width:0"><div style="height:56px;border-radius:10px;background:var(--status-cautionary,rgb(225,138,15));box-shadow:inset 0 0 0 1px rgba(112,115,124,0.12)"></div><div style="margin-top:6px;font:600 11px/1.3 var(--font-sans);color:var(--label-normal)">Cautionary</div><div style="font:500 10px/1.3 var(--font-mono);color:var(--label-alternative,#8a8d94)">rgb(225,138,15)</div></div>
<div style="flex:1;min-width:0"><div style="height:56px;border-radius:10px;background:var(--primary-normal,rgb(17,109,255));box-shadow:inset 0 0 0 1px rgba(112,115,124,0.12)"></div><div style="margin-top:6px;font:600 11px/1.3 var(--font-sans);color:var(--label-normal)">Informative</div><div style="font:500 10px/1.3 var(--font-mono);color:var(--label-alternative,#8a8d94)">rgb(17,109,255)</div></div>
</div></body></html>
