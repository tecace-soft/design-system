<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--background-normal-normal,#fff);font-family:var(--font-sans)}*{box-sizing:border-box}</style></head><body><div style="display:flex;flex-direction:column;gap:8px">
