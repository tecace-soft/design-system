<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--background-normal-normal,#fff);font-family:var(--font-sans)}*{box-sizing:border-box}</style></head><body><div style="display:flex;gap:10px">
<div style="flex:1;min-width:0"><div style="height:56px;border-radius:10px;background:var(--violet-50,rgb(88,96,213));box-shadow:inset 0 0 0 1px rgba(112,115,124,0.12)"></div><div style="margin-top:6px;font:600 11px/1.3 var(--font-sans);color:var(--label-normal)">Violet</div><div style="font:500 10px/1.3 var(--font-mono);color:var(--label-alternative,#8a8d94)">rgb(88,96,213)</div></div>
<div style="flex:1;min-width:0"><div style="height:56px;border-radius:10px;background:var(--purple-50,rgb(112,56,225));box-shadow:inset 0 0 0 1px rgba(112,115,124,0.12)"></div><div style="margin-top:6px;font:600 11px/1.3 var(--font-sans);color:var(--label-normal)">Purple</div><div style="font:500 10px/1.3 var(--font-mono);color:var(--label-alternative,#8a8d94)">rgb(112,56,225)</div></div>
<div style="flex:1;min-width:0"><div style="height:56px;border-radius:10px;background:var(--pink-50,rgb(245,50,168));box-shadow:inset 0 0 0 1px rgba(112,115,124,0.12)"></div><div style="margin-top:6px;font:600 11px/1.3 var(--font-sans);color:var(--label-normal)">Pink</div><div style="font:500 10px/1.3 var(--font-mono);color:var(--label-alternative,#8a8d94)">rgb(245,50,168)</div></div>
<div style="flex:1;min-width:0"><div style="height:56px;border-radius:10px;background:var(--red-orange-50,rgb(235,78,28));box-shadow:inset 0 0 0 1px rgba(112,115,124,0.12)"></div><div style="margin-top:6px;font:600 11px/1.3 var(--font-sans);color:var(--label-normal)">Red-Orange</div><div style="font:500 10px/1.3 var(--font-mono);color:var(--label-alternative,#8a8d94)">rgb(235,78,28)</div></div>
<div style="flex:1;min-width:0"><div style="height:56px;border-radius:10px;background:var(--lime-50,rgb(102,188,18));box-shadow:inset 0 0 0 1px rgba(112,115,124,0.12)"></div><div style="margin-top:6px;font:600 11px/1.3 var(--font-sans);color:var(--label-normal)">Lime</div><div style="font:500 10px/1.3 var(--font-mono);color:var(--label-alternative,#8a8d94)">rgb(102,188,18)</div></div>
<div style="flex:1;min-width:0"><div style="height:56px;border-radius:10px;background:var(--cyan-50,rgb(0,185,220));box-shadow:inset 0 0 0 1px rgba(112,115,124,0.12)"></div><div style="margin-top:6px;font:600 11px/1.3 var(--font-sans);color:var(--label-normal)">Cyan</div><div style="font:500 10px/1.3 var(--font-mono);color:var(--label-alternative,#8a8d94)">rgb(0,185,220)</div></div>
</div></body></html>
