<!-- @dsCard group="TecAce Careers" viewport="390x760" name="Careers App" subtitle="Job feed → detail → apply · mobile" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css">
<title>TecAce Careers</title>
<style>
  html,body{margin:0;height:100%}
  body{background:var(--background-normal-alternative,#f5feff);display:flex;align-items:center;justify-content:center;font-family:var(--font-sans)}
  #phone{width:390px;height:760px;background:var(--background-normal-normal,#fff);border-radius:36px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(23,23,25,0.18);display:flex;flex-direction:column}
  #root{flex:1;min-height:0;display:flex;flex-direction:column}
  .scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .scroll::-webkit-scrollbar{display:none}
</style></head>
<body><div id="phone"><div id="root"></div></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const DS = window.TecAceDesignSystem_64e6de;
const { Button, IconButton, Chip, Category, Card, Avatar, ContentBadge, Badge, BottomNavigation, Tab, Divider } = DS;
const ic = (d,fill=true) => <svg viewBox="0 0 24 24" width="100%" height="100%" fill={fill?'currentColor':'none'} stroke={fill?'none':'currentColor'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{d}</svg>;
const IcHome = ic(<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/>);
const IcJobs = ic(<path d="M4 7h16v13H4zM9 7V5a1 1 0 011-1h4a1 1 0 011 1v2"/>,false);
const IcSocial = ic(<path d="M12 12a4 4 0 100-8 4 4 0 000 8zm-7 8a7 7 0 0114 0z"/>,false);
const IcMy = ic(<path d="M12 12a5 5 0 100-10 5 5 0 000 10zm-8 9a8 8 0 0116 0z"/>,false);
const IcBell = ic(<path d="M18 16l-1.5-2v-4a4.5 4.5 0 00-9 0v4L6 16zM9.5 19a2.5 2.5 0 005 0"/>,false);
const IcBack = ic(<path d="M15 5l-7 7 7 7"/>,false);
const IcBookmark = (on)=>ic(<path d="M6 4h12v16l-6-4-6 4z"/>,!on);
const IcMap = ic(<><path d="M12 21s7-6.5 7-11a7 7 0 10-14 0c0 4.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></>,false);

const JOBS = [
  {id:1,co:'토스',color:'#0064FF',role:'Frontend Engineer',loc:'서울 · 강남구',tags:['React','정규직'],badge:'채용중',pay:'상위 10% 연봉',cat:'개발'},
  {id:2,co:'배민',color:'#2AC1BC',role:'Product Designer',loc:'서울 · 송파구',tags:['Figma','경력 3년+'],badge:'신규',pay:'스톡옵션',cat:'디자인'},
  {id:3,co:'카카오',color:'#FEE500',fg:'#191919',role:'Data Scientist',loc:'판교 · 분당구',tags:['Python','ML'],badge:'채용중',pay:'재택 가능',cat:'데이터'},
  {id:4,co:'네이버',color:'#03C75A',role:'Backend Engineer',loc:'분당 · 정자동',tags:['Kotlin','대규모'],badge:'마감임박',bcolor:'negative',pay:'사이닝 보너스',cat:'개발'},
  {id:5,co:'쿠팡',color:'#F03E3E',role:'PM · 물류플랫폼',loc:'서울 · 송파구',tags:['Growth','영어'],badge:'채용중',pay:'글로벌',cat:'기획'},
];

function Header({title,right}){return (
  <div style={{display:'flex',alignItems:'center',gap:8,padding:'14px 16px',background:'var(--background-normal-normal,#fff)',boxShadow:'inset 0 -1px 0 var(--line-normal,rgba(112,115,124,0.12))'}}>
    <span style={{flex:1,font:'700 22px/1.3 var(--font-sans)',letterSpacing:'-0.019em',color:'var(--label-normal)'}}>{title}</span>
    {right}
  </div>);}

function JobCard({job,saved,onSave,onOpen}){return (
  <Card variant="outlined" padding={16} onClick={onOpen} style={{marginBottom:12}}>
    <div style={{display:'flex',gap:12}}>
      <span style={{width:44,height:44,borderRadius:12,background:job.color,color:job.fg||'#fff',display:'inline-flex',alignItems:'center',justifyContent:'center',font:'700 15px/1 var(--font-display)',flexShrink:0}}>{job.co.slice(0,2)}</span>
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:2}}>
          <ContentBadge label={job.badge} color={job.bcolor||'primary'} size="sm"/>
          <span style={{font:'500 12px/1.3 var(--font-sans)',color:'var(--label-alternative)'}}>{job.co}</span>
        </div>
        <div style={{font:'600 16px/1.4 var(--font-sans)',color:'var(--label-normal)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{job.role}</div>
        <div style={{font:'500 13px/1.4 var(--font-sans)',color:'var(--label-neutral)',marginTop:2}}>{job.loc}</div>
      </div>
      <span onClick={e=>{e.stopPropagation();onSave();}} style={{width:24,height:24,color:saved?'var(--primary-normal)':'var(--label-alternative)',flexShrink:0,cursor:'pointer'}}>{IcBookmark(saved)}</span>
    </div>
    <div style={{display:'flex',gap:6,marginTop:12,flexWrap:'wrap'}}>
      {job.tags.map(t=><Chip key={t} label={t} size="xs" variant="alternative"/>)}
      <Chip label={job.pay} size="xs" variant="alternative"/>
    </div>
  </Card>);}

function Feed({go,saved,toggleSave}){
  const [cat,setCat]=React.useState('전체');
  const list = cat==='전체'?JOBS:JOBS.filter(j=>j.cat===cat);
  return (<>
    <Header title="채용" right={<Badge dot><span style={{width:24,height:24,display:'inline-flex',color:'var(--label-normal)'}}>{IcBell}</span></Badge>}/>
    <div className="scroll">
      <div style={{padding:'12px 16px 4px'}}>
        <Category value={cat} onChange={setCat} items={['전체','개발','디자인','기획','데이터','마케팅']}/>
      </div>
      <div style={{padding:'8px 16px 16px'}}>
        <div style={{font:'600 13px/1.4 var(--font-sans)',color:'var(--label-alternative)',margin:'4px 0 12px'}}>{list.length}개의 포지션</div>
        {list.map(j=><JobCard key={j.id} job={j} saved={!!saved[j.id]} onSave={()=>toggleSave(j.id)} onOpen={()=>go({s:'detail',job:j})}/>)}
      </div>
    </div>
  </>);}

function Detail({job,back,saved,toggleSave,onApply}){return (<>
  <Header title="" right={<span/>} />
  <div style={{position:'absolute',top:14,left:8}}><IconButton icon={IcBack} variant="normal" aria-label="뒤로" onClick={back}/></div>
  <div className="scroll" style={{padding:'4px 20px 20px'}}>
    <span style={{width:64,height:64,borderRadius:18,background:job.color,color:job.fg||'#fff',display:'inline-flex',alignItems:'center',justifyContent:'center',font:'700 22px/1 var(--font-display)'}}>{job.co.slice(0,2)}</span>
    <div style={{display:'flex',alignItems:'center',gap:6,margin:'16px 0 4px'}}><ContentBadge label={job.badge} color={job.bcolor||'primary'} size="sm"/><span style={{font:'500 13px/1.3 var(--font-sans)',color:'var(--label-alternative)'}}>{job.co}</span></div>
    <div style={{font:'700 24px/1.34 var(--font-sans)',letterSpacing:'-0.023em',color:'var(--label-normal)'}}>{job.role}</div>
    <div style={{display:'flex',alignItems:'center',gap:4,margin:'8px 0 16px',color:'var(--label-neutral)'}}><span style={{width:16,height:16,display:'inline-flex'}}>{IcMap}</span><span style={{font:'500 14px/1.4 var(--font-sans)'}}>{job.loc}</span></div>
    <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:20}}>{job.tags.concat([job.pay]).map(t=><Chip key={t} label={t} size="sm" variant="alternative"/>)}</div>
    <Divider/>
    <h3 style={{font:'600 18px/1.44 var(--font-sans)',color:'var(--label-normal)',margin:'20px 0 8px'}}>주요 업무</h3>
    <p style={{font:'500 15px/1.6 var(--font-sans)',color:'var(--label-neutral)',margin:0}}>사용자 중심의 제품을 함께 만들어갈 동료를 찾습니다. 팀과 협업하여 핵심 지표를 개선하고, 더 나은 지원자 경험을 설계합니다.</p>
    <h3 style={{font:'600 18px/1.44 var(--font-sans)',color:'var(--label-normal)',margin:'20px 0 8px'}}>자격 요건</h3>
    <ul style={{font:'500 15px/1.7 var(--font-sans)',color:'var(--label-neutral)',margin:0,paddingLeft:18}}>
      <li>관련 경력 3년 이상</li><li>협업 도구에 능숙한 분</li><li>데이터 기반 의사결정을 즐기는 분</li>
    </ul>
  </div>
  <div style={{display:'flex',gap:10,padding:'12px 16px 16px',boxShadow:'inset 0 1px 0 var(--line-normal,rgba(112,115,124,0.12))',background:'var(--background-normal-normal,#fff)'}}>
    <IconButton icon={IcBookmark(!!saved[job.id])} variant="outlined" size="lg" aria-label="저장" onClick={()=>toggleSave(job.id)} style={{color:saved[job.id]?'var(--primary-normal)':'var(--label-normal)'}}/>
    <Button label="지원하기" size="lg" style={{flex:1}} onClick={onApply}/>
  </div>
</>);}

function Placeholder({title}){return (<>
  <Header title={title}/>
  <div className="scroll" style={{display:'flex',alignItems:'center',justifyContent:'center'}}>
    <span style={{font:'500 15px/1.5 var(--font-sans)',color:'var(--label-alternative)'}}>{title} 화면</span>
  </div>
</>);}

function App(){
  const [nav,setNav]=React.useState('jobs');
  const [view,setView]=React.useState({s:'feed'});
  const [saved,setSaved]=React.useState({});
  const [toast,setToast]=React.useState(false);
  const toggleSave=(id)=>setSaved(s=>({...s,[id]:!s[id]}));
  const go=(v)=>setView(v);
  const apply=()=>{setToast(true);setTimeout(()=>setToast(false),1800);};
  let screen;
  if(nav!=='jobs') screen=<Placeholder title={{home:'홈',social:'소셜',my:'마이'}[nav]}/>;
  else if(view.s==='detail') screen=<Detail job={view.job} back={()=>go({s:'feed'})} saved={saved} toggleSave={toggleSave} onApply={apply}/>;
  else screen=<Feed go={go} saved={saved} toggleSave={toggleSave}/>;
  return (<div style={{height:'100%',display:'flex',flexDirection:'column',position:'relative'}}>
    <div style={{flex:1,minHeight:0,display:'flex',flexDirection:'column'}}>{screen}</div>
    <BottomNavigation value={nav} onChange={(v)=>{setNav(v);setView({s:'feed'});}} items={[
      {label:'홈',value:'home',icon:IcHome},{label:'채용',value:'jobs',icon:IcJobs},
      {label:'소셜',value:'social',icon:IcSocial},{label:'마이',value:'my',icon:IcMy}]}/>
    {toast && <div style={{position:'absolute',left:16,right:16,bottom:88,display:'flex',justifyContent:'center'}}>
      <DS.Toast message="지원이 완료되었어요" actionLabel="확인"/></div>}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
